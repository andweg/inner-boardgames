name: Refresh game data

on:
  schedule:
    # 00:00 and 12:00 KST (KST = UTC+9) → 15:00 and 03:00 UTC.
    - cron: '0 15 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch: {}

# Allow the job to commit the refreshed data back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If fetch exits non-zero the workflow fails here and nothing is committed.
      # BGG's XML API requires a Bearer token; it comes from a repository secret
      # (Settings → Secrets and variables → Actions → new secret BGG_API_TOKEN).
      - name: Fetch data from BGG
        run: npm run fetch
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}

      - name: Commit refreshed data if changed
        run: |
          if [[ -n "$(git status --porcelain data static/covers)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data static/covers
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes — nothing to commit."
          fi
