<!doctype html>
<html lang="ko" data-locale="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6EAFEE" />
    <!--
      Resolve the locale before first paint: read the saved choice or the
      browser language, then set <html lang> / data-locale so the store seeds
      the correct language with no hydration flash.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('locale');
          var loc =
            saved === 'ko' || saved === 'en'
              ? saved
              : (navigator.language || 'en').toLowerCase().indexOf('ko') === 0
                ? 'ko'
                : 'en';
          var el = document.documentElement;
          el.lang = loc;
          el.setAttribute('data-locale', loc);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
